name: Relay release dry-run

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product key from config/products.yml
        required: true
        default: foundation-sunshine
        type: string
      tag:
        description: Exact source release tag; empty means latest non-draft release
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout relay
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install config parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Resolve and validate source release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          TAG: ${{ inputs.tag }}
        run: |
          args=(--product "$PRODUCT")
          if [[ -n "$TAG" ]]; then
            args+=(--tag "$TAG")
          fi
          python scripts/relay_release.py "${args[@]}"

      - name: Publish validation summary
        run: |
          {
            echo '## Relay validation record'
            echo
            echo '```json'
            cat out/release-record.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
